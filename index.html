<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>유리병 편지 섬</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed 3D island; a quiet ink HUD sits in the corners; letters open as paper sheets over the scene. Single committed look (the scene has its own day and night). */
:root{
  --ink:#0f2029;
  --panel:rgba(13,29,38,.74);
  --panel-line:rgba(243,236,220,.16);
  --fg:#f3ecdc;
  --muted:#b6c3c2;
  --paper:#f1e6cc;
  --paper-ink:#2b2922;
  --paper-muted:#7a705c;
  --glass:#86cdb0;
  --warn:#e9ab72;
  --font-letter:'Gowun Batang','Noto Serif KR','Apple SD Gothic Neo',serif;
  --font-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;filter:saturate(1.07) contrast(1.03)}
#grade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0;background:#ffb060}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud > *{pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.row.bottom{align-items:flex-end}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
.title{font-family:var(--font-letter);font-weight:700;font-size:17px;letter-spacing:.02em}
.status{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.seedbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seedbox .label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.seedbox .num{font-variant-numeric:tabular-nums;font-size:15px}
.compass{width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-line);position:relative;flex:none}
.compass i{position:absolute;inset:0;display:block}
.compass i::before{content:"북";position:absolute;left:50%;top:1px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--warn)}
button{font:inherit;color:var(--fg);background:rgba(243,236,220,.1);border:1px solid var(--panel-line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:rgba(243,236,220,.18)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.shelf{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.slots{display:flex;gap:6px;align-items:flex-end;border-bottom:3px solid #8a6a47;padding:0 6px 2px}
.slot{width:14px;height:30px;border:1.5px dashed rgba(243,236,220,.35);border-radius:6px 6px 3px 3px;position:relative}
.slot.full{border:1.5px solid var(--glass);background:rgba(134,205,176,.35)}
.slot.full::before{content:"";position:absolute;left:50%;top:-7px;width:6px;height:7px;transform:translateX(-50%);background:#b98a55;border-radius:2px 2px 0 0}
.shelfnote{font-size:12px;color:var(--muted);max-width:22em}
.shelfnote.full{color:var(--warn)}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1 1 200px;min-width:0}
#action{pointer-events:auto;font-size:16px;padding:10px 18px;background:var(--fg);color:var(--ink);border-color:transparent;font-family:var(--font-letter);font-weight:700}
#action:hover{background:#fff}
#toast{pointer-events:none;max-width:32em;text-align:center;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:8px 14px;font-size:14px;transition:opacity .4s}
#toast.off{opacity:0}
.help{font-size:12px;color:var(--muted);max-width:24em}
.help b{color:var(--fg);font-weight:400}
.veil{position:absolute;inset:0;background:rgba(8,18,24,.55);display:flex;align-items:center;justify-content:center;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(34em,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:26px 26px 20px;
  font-family:var(--font-letter);font-size:16px;line-height:1.85;box-shadow:0 18px 50px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(transparent 0 28.6px,rgba(43,41,34,.07) 28.6px 29.6px)}
.sheet .tag{font-family:var(--font-ui);font-size:12px;letter-spacing:.08em;color:var(--paper-muted);margin:0 0 10px}
.sheet p{margin:0 0 14px;text-wrap:pretty}
.sheet h2{font-size:18px;margin:0 0 10px;text-wrap:balance}
.sheet .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-family:var(--font-ui)}
.sheet button{color:var(--paper-ink);background:rgba(43,41,34,.07);border-color:rgba(43,41,34,.25)}
.sheet button:hover{background:rgba(43,41,34,.14)}
.sheet button.primary{background:var(--paper-ink);color:var(--paper);border-color:transparent}
.sheet button.primary:hover{background:#000}
.sheet .note{font-family:var(--font-ui);font-size:13px;color:var(--paper-muted);margin:6px 0 0}
.sheet .err{font-family:var(--font-ui);font-size:13px;color:#9b3d1f;margin:6px 0 0;min-height:1.5em}
.sheet textarea{width:100%;box-sizing:border-box;min-height:9.5em;resize:vertical;background:transparent;border:1px solid rgba(43,41,34,.3);border-radius:3px;
  color:var(--paper-ink);font-family:var(--font-letter);font-size:16px;line-height:1.8;padding:8px 10px}
.sheet .count{font-family:var(--font-ui);font-size:12px;color:var(--paper-muted);text-align:right;font-variant-numeric:tabular-nums}
.sheet.radio{background:#14262f;color:var(--fg);background-image:none;font-family:var(--font-ui);border:1px solid var(--panel-line);border-radius:10px}
.sheet.radio .tag{color:var(--muted)}
.sheet.radio button{color:var(--fg);background:rgba(243,236,220,.1);border-color:var(--panel-line)}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.sheet label{display:block;font-family:var(--font-ui);font-size:13px;color:var(--paper-muted);margin:8px 0 4px}
.sheet input{width:100%;box-sizing:border-box;background:transparent;border:1px solid rgba(43,41,34,.3);border-radius:3px;color:var(--paper-ink);font:inherit;padding:7px 10px}
#lock{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;cursor:none;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lock.ask{cursor:auto;background:rgba(8,18,24,.5)}
.lockbox{width:min(20em,100%);background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:18px 18px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px}
.lockbox label{font-size:13px;color:var(--muted)}
.lockbox input{font:inherit;font-size:18px;letter-spacing:.2em;color:var(--fg);background:rgba(243,236,220,.08);border:1px solid var(--panel-line);border-radius:8px;padding:9px 12px;width:100%;box-sizing:border-box}
.lockbox input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.lockerr{margin:0;min-height:1.5em;font-size:13px;color:var(--warn)}
.lockbtns{display:flex;flex-wrap:wrap;gap:8px}
#lockgo{background:var(--fg);color:var(--ink);border-color:transparent}
.writebar{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:8px 12px;font-size:14px;z-index:5}
.writebar .wbtns{display:flex;gap:6px}
#wgo{background:var(--fg);color:var(--ink);border-color:transparent}
@media (max-width:520px){ .help{display:none} .title{font-size:15px} }
</style>
</head>
<body>

<div id="app">
  <canvas id="scene" tabindex="0" aria-label="3D 섬. 땅을 누르면 걸어갑니다."></canvas>
  <div id="grade" aria-hidden="true"></div>

  <div class="hud" id="hud">
    <div class="row">
      <div class="panel">
        <div class="title">유리병 편지 섬</div>
        <div class="status" id="status">1일째</div>
      </div>
      <div class="panel seedbox">
        <div class="compass" aria-hidden="true"><i id="needle"></i></div>
        <div>
          <div class="label">섬 시드</div>
          <div class="num" id="seed">00000</div>
        </div>
        <button id="reroll" type="button">다른 섬</button>
        <button id="saver" type="button">화면보호</button>
        <button id="wxbtn" type="button">날씨</button>
      </div>
    </div>

    <div class="row bottom">
      <div class="panel shelf">
        <div class="slots" id="slots" aria-label="가진 병">
          <span class="slot"></span><span class="slot"></span><span class="slot"></span>
        </div>
        <button id="write" type="button">편지 쓰기</button>
        <button id="sit" type="button">앉기</button>
        <button id="sandw" type="button">모래글쓰기</button>
        <div class="shelfnote" id="shelfnote"></div>
      </div>
      <div class="center">
        <div id="toast" class="off" role="status" aria-live="polite"></div>
        <button id="action" type="button" hidden>병을 줍는다</button>
      </div>
      <div class="panel help">
        <b>땅을 누르면 걷고, 끌면 둘러봅니다.</b> 방향키와 휠도 됩니다.<br>
        시연이라 하루가 6분으로 흐르고, 편지는 어디에도 저장되지 않습니다.
      </div>
    </div>
  </div>

  <div class="writebar" id="writebar" hidden>
    <span>손가락이나 마우스로 모래 위에 글씨를 쓰세요.</span>
    <div class="wbtns"><button id="wclear" type="button">지우기</button><button id="wcancel" type="button">그만두기</button><button id="wgo" type="button">새기기</button></div>
  </div>
  <div class="veil" id="veil" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
  </div>
  <div id="lock" hidden>
    <form class="lockbox" id="lockform" autocomplete="off" hidden>
      <div class="title">잠긴 섬</div>
      <label for="lockpin">암호</label>
      <input id="lockpin" type="password" autocomplete="off" maxlength="20">
      <p class="lockerr" id="lockerr" role="alert"></p>
      <div class="lockbtns"><button type="submit" id="lockgo">잠금 해제</button><button type="button" id="lockfs">전체화면으로</button></div>
    </form>
  </div>
  <div id="fail" hidden>이 기기에서는 3D 화면을 열 수 없습니다. WebGL을 지원하는 브라우저에서 다시 열어 주세요.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
if(!window.THREE){ $('fail').hidden=false; return; }
// 카툰 렌더링: 햇빛이 닿는 면과 그늘을 부드러운 경계로 나누고, 가장자리에 옅은 테두리 빛을 더한다. 모든 표준 재질에 적용된다
(function(){var C=THREE.ShaderChunk;
  for(var k in C){if(typeof C[k]==='string'&&C[k].indexOf('vec3 irradiance = dotNL * directLight.color;')>=0)
    C[k]=C[k].split('vec3 irradiance = dotNL * directLight.color;').join('vec3 irradiance = ( smoothstep( 0.0, 0.14, dotNL ) * 0.74 + dotNL * 0.26 ) * directLight.color;')}
  C.lights_fragment_end=C.lights_fragment_end+'\n{float rimF=1.0-saturate(dot(geometry.normal,geometry.viewDir));reflectedLight.indirectDiffuse+=diffuseColor.rgb*smoothstep(0.55,0.95,rimF)*0.22;}';
})();


/* ---------- 편지 ---------- */
var RULES=[
 ['이 병을 주운 분께.',
  '저도 혼자 있기로 하고 이런 섬에 왔습니다. 먹을 것은 걱정하지 않아도 됩니다. 여기서는 할 일이 많지 않습니다. 걷고, 기다리고, 가끔 이렇게 씁니다.',
  '당신에게는 처음부터 병이 하나 있었을 겁니다. 그리고 지금 이 병도 당신 것이 되었습니다. 병에 글을 넣어 바다에 던지면 어딘가의 누군가에게 반드시 닿습니다. 누구에게 닿을지는 고를 수 없습니다. 닿았는지도, 읽혔는지도 끝내 알 수 없습니다. 답장도 오지 않습니다. 저 역시 이 편지가 당신에게 닿았다는 것을 모릅니다.',
  '그래도 저는 던졌습니다.'],
 ['병은 세 개까지만 곁에 둘 수 있습니다. 그늘막 선반이 세 칸인 것을 보셨을 겁니다.',
  '선반이 가득 찬 동안에는 바다가 아무것도 보내지 않습니다. 저는 그걸 모르고 오랫동안 빈 해변만 걸었습니다.',
  '한 칸이라도 비어 있으면 이레 안에 병 하나는 옵니다. 더 일찍 올 때도 있지만 이레를 넘긴 적은 없었습니다.',
  '조용히 지내고 싶으면 세 개를 그대로 두면 됩니다. 바깥이 궁금해지면 하나를 써서 보내세요.'],
 ['라디오는 해가 있을 때만 켜집니다. 흐린 날과 밤에는 잡음뿐입니다. 들리는 것은 날씨와 물때 이야기가 전부인데, 그게 쓸모가 있습니다.',
  '병은 파도와 물때와 바람을 따라 오기 때문에 매번 다른 곳에 닿습니다. 큰 바람이 지나간 다음 날에는 평소 가지 않던 쪽 해변도 걸어보세요. 도착한 병을 오래 찾지 못하면 밀물이 다시 가져가서 다른 섬으로 보냅니다.',
  '두 가지만 더 적습니다. 편지에 이름이나 사는 곳, 연락할 방법은 적지 마세요. 그런 글은 병에 들어가지 않습니다. 그리고 받은 편지가 누군가를 해치려는 글이라면 병째 바다에 가라앉히세요. 가라앉은 편지는 다시 떠오르지 않습니다.']
];
var SAMPLES=[
 ['오늘 아침에는 안개가 껴서 바다와 하늘이 구분되지 않았습니다.','한참 서 있다가 돌아와 이 편지를 씁니다. 별일은 없었습니다. 별일 없는 날을 누군가에게 말하고 싶었습니다.'],
 ['섬 북쪽에 납작한 바위가 하나 있습니다. 해 질 때 거기 앉아 있으면 등이 따뜻합니다.','당신 섬에도 그런 자리가 있기를 바랍니다. 없다면 찾아보세요. 찾는 데 며칠 걸려도 괜찮습니다.'],
 ['라디오에서 내일 비가 온다고 했습니다. 저는 비 오는 날을 좋아합니다. 그늘막 지붕에 떨어지는 소리가 좋아서요.','이 병이 닿을 때쯤 그쪽 날씨는 어떨지 궁금합니다. 대답을 들을 수 없다는 걸 알면서도 묻습니다.'],
 ['병이 세 개가 된 적이 있습니다. 한 달쯤 아무것도 쓰지 않았습니다.','그러다 어느 날 문득 하나를 던졌고, 닷새 뒤에 다른 병이 왔습니다. 이 편지는 그때 얻은 병에 담았습니다.'],
 ['나무 열매를 세어 보다가 그만두었습니다. 셀 필요가 없다는 걸 알았기 때문입니다.','여기서는 모자란 것이 없습니다. 가끔 말이 모자랄 뿐입니다. 그래서 이렇게 적어 보냅니다.']
];

/* ---------- 난수와 지형 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function sm(t){return t*t*(3-2*t)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function smoothstep(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}

var DAY=360;                // 시연: 하루 = 6분
var DIRS=['북','북동','동','남동','남','남서','서','북서'];
function bearingName(x,z){var b=Math.atan2(x,-z); if(b<0)b+=Math.PI*2; return DIRS[Math.round(b/(Math.PI/4))%8]}

var canvas=$('scene'), renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true}); }catch(e){ $('fail').hidden=false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var V3=THREE.Vector3;
function col(hex){return new THREE.Color(hex).convertSRGBToLinear()}
function mat(hex,o){o=o||{};o.color=col(hex);if(o.roughness===undefined)o.roughness=.78;if(o.metalness===undefined)o.metalness=0;return new THREE.MeshStandardMaterial(o)}
function add(parent,geo,m,x,y,z){var o=new THREE.Mesh(geo,m);o.position.set(x||0,y||0,z||0);parent.add(o);return o}
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(46,1,0.5,1500);
scene.fog=new THREE.Fog(0xa9dcec,170,640);
var hemi=new THREE.HemisphereLight(col(0xeef8ff),col(0xe0cfa2),0.55); scene.add(hemi);
var sun=new THREE.DirectionalLight(col(0xfff2dc),0.75); sun.castShadow=true;
var coarse=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
sun.shadow.mapSize.set(coarse?1024:2048,coarse?1024:2048);
(function(c){c.left=-55;c.right=55;c.top=55;c.bottom=-55;c.near=1;c.far=420})(sun.shadow.camera);
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.5; scene.add(sun); scene.add(sun.target);
var sunBall=new THREE.Mesh(new THREE.SphereGeometry(11,20,14),new THREE.MeshBasicMaterial({color:col(0xffe9b8),fog:false})); scene.add(sunBall);

// 모닥불 빛, 불빛 번짐, 별
var fireLight=new THREE.PointLight(col(0xff8a3c),0,30,2); scene.add(fireLight);

  state.ripT=(state.ripT||0)-dt; if(state.ripT<=0&&state.sit==='none'){state.ripT=1.3;if(waterDepth(who.position.x,who.position.z)>.04)footRipple(who.position.x,who.position.z,.35)}

  // 바위, 게, 갈매기
  rockU.uSea.value=W.sea; updCrabs(dt,t,who); updGulls(dt,t,who,e); updChicks(dt,t,who); updWhale(dt,t,who,light);

  // 화면보호 중에는 카메라가 천천히 섬을 돈다. 암호창은 12초 동안 입력이 없으면 닫힌다
  if(saverOn){state.yaw+=dt*0.05;if(askOn){askT-=dt;if(askT<=0)hideAsk()}}

  // 카메라
  // 아래로 끌어 카메라를 낮추면 시선이 하늘로 올라간다
  var pc=Math.max(state.pitch,.18), lookUp=Math.tan(Math.max(0,.18-state.pitch)*1.6)*state.dist;
  var cp=Math.cos(pc), cx=who.position.x+Math.sin(state.yaw)*cp*state.dist, cz=who.position.z+Math.cos(state.yaw)*cp*state.dist, cy=who.position.y+1.6+Math.sin(pc)*state.dist;
  cy=Math.max(cy,Math.max(W.height(cx,cz),W.sea)+1.5);
  // 내려다볼 때는 야자수가 시야를 가리지 않게 잠시 감춘다
  var treeVis=WR.camK<.55; for(var tv=0;tv<W.trees.length;tv++)W.trees[tv].visible=treeVis;
  // 모래글쓰기: 하늘에서 쓸 자리를 곧장 내려다보는 시점으로 부드럽게 옮겨 간다. 화면 위쪽이 캐릭터가 바라보는 쪽이다
  WR.camK+=((WR.mode==='draw'?1:0)-WR.camK)*Math.min(1,dt*3); var ck=smoother(clamp(WR.camK,0,1));
  var lx=who.position.x,ly=who.position.y+1.8+lookUp,lz=who.position.z;
  if(ck>.001){cx=lerp(cx,WR.center.x-WR.face.x*.02,ck);cy=lerp(cy,WR.center.y+15,ck);cz=lerp(cz,WR.center.z-WR.face.z*.02,ck);lx=lerp(lx,WR.center.x,ck);ly=lerp(ly,WR.center.y,ck);lz=lerp(lz,WR.center.z,ck);camera.up.set(WR.face.x*ck,1-ck,WR.face.z*ck).normalize()}else camera.up.set(0,1,0);
  camera.position.set(cx,cy,cz); camera.lookAt(lx,ly,lz);
  rainSys.update(dt,camera.position,WX.rain,WX.wind,wdx,wdz,light);

  // 글자 표시
  statusT-=dt; if(statusT<=0){statusT=.5;
    $('status').textContent=day+'일째 · '+(e<0?'밤':e<0.3?'해 질 녘':'낮')+' · '+WX_KIND[WX.kind].name+' · '+(W.seaRising?'밀물':'썰물');
    $('needle').style.transform='rotate('+state.yaw+'rad)'}
  gradeT-=dt; if(gradeT<=0){gradeT=.25;
    var tmp=light*(.15*(1-WX.cover))+dusk*.75*(1-WX.dark)-(1-light)*.45-WX.cover*.25*light-WX.rain*.25-WX.storm*.25;tmp=clamp(tmp,-1,1);
    var ge=$('grade');ge.style.background=tmp>0?'#ffad5c':'#5f8dff';ge.style.opacity=(Math.abs(tmp)*.42).toFixed(3);
    canvas.style.filter='saturate('+(1.07-.28*WX.dark-.08*WX.rain).toFixed(3)+') contrast('+(1.03-.06*WX.dark).toFixed(3)+')'}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.add('off')}

  renderer.render(scene,camera);
}

var seed0=0; try{seed0=parseInt(localStorage.getItem('bottle-island-seed'),10)||0}catch(e){}
if(!(seed0>=10000&&seed0<=99999))seed0=48213;
buildIsland(seed0); resize(); saverBoot();
toast('해변 어딘가에 병이 하나 밀려와 있습니다. 걸어서 찾아보세요.',9);
requestAnimationFrame(frame);
})();
